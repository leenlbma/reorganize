name: Deploy reading site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and check the complete reading site
        run: |
          node --check website/src/app.js
          node website/scripts/build.mjs
          node website/scripts/validate.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
